name: visual_time_counter
description: "Kid Timer: a free, open source visual timer for children."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

# v1.x packages (home_widget, flutter_alarmkit, share_plus) are added by their own phases.
dependencies:
  audioplayers: ^6.8.1
  clock: ^1.1.3
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.0.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  image: ^4.12.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  meta: ^1.19.0
  path_provider: ^2.1.6
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  wakelock_plus: ^1.8.2
  web: ^1.1.2
  window_manager: ^0.5.2

dev_dependencies:
  alchemist: ^0.14.1
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  patrol: ^4.10.0
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/bank/
    - assets/sounds/
    - assets/legal/

  fonts:
    - family: AtkinsonHyperlegibleNext
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext/AtkinsonHyperlegibleNext-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegibleNext/AtkinsonHyperlegibleNext-Bold.ttf
          weight: 700

patrol:
  app_name: Kid Timer
  test_directory: patrol_test
  android:
    package_name: io.github.masterkey07.visualtimecounter
  ios:
    bundle_id: io.github.masterkey07.visualtimecounter
