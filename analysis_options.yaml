include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - lib/l10n/generated/**
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # Required only for lib/core (Constitution VIII); re-enabled in lib/core/analysis_options.yaml.
    public_member_api_docs: false
